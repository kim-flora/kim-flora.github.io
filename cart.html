<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giỏ hàng | KIM FLORA</title><link rel="stylesheet" href="app.css"><style>.cart-layout{display:grid;grid-template-columns:1fr 350px;gap:18px;align-items:start}.cart-list,.summary{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.cart-list{padding:10px 18px}.cart-row{display:grid;grid-template-columns:94px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cart-row:last-child{border-bottom:0}.cart-row img{width:94px;height:94px;object-fit:cover;border-radius:11px;background:#f7f7f7}.cart-row h3{font-size:14px;margin:0 0 5px}.cart-meta{font-size:11px;color:#81777c}.qty-mini{display:flex;align-items:center;border:1px solid #ddd5d9;border-radius:9px;overflow:hidden;width:max-content;margin-top:8px}.qty-mini button{border:0;background:#fafafa;width:30px;height:30px}.qty-mini span{min-width:35px;text-align:center;font-size:12px}.summary{padding:18px;position:sticky;top:105px}.summary h2{font-size:18px;margin:0 0 12px}.sum-line{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin:8px 0}.sum-total{font-size:18px;font-weight:900;color:var(--pink-deep);padding-top:10px;border-top:1px solid var(--line)}@media(max-width:800px){.cart-layout{grid-template-columns:1fr}.summary{position:static}}@media(max-width:520px){.cart-row{grid-template-columns:78px 1fr}.cart-row img{width:78px;height:78px}.cart-row>div:last-child{grid-column:2;text-align:left!important}}</style></head><body><header class="site-header"><div class="header-inner"><a class="logo" href="index.html"><b>KIM FLORA</b><span>HOA & QUÀ TẶNG</span></a><div class="header-actions"><a class="pill-link" href="account.html"><span data-account-label>Đăng nhập</span></a><a class="pill-link" href="cart.html">Giỏ hàng <span class="cart-count" data-cart-count>0</span></a></div></div></header><main class="container"><div class="section-title"><span class="kicker">ĐƠN HÀNG</span><h2>Giỏ hàng của bạn</h2><p>Kiểm tra mẫu và số lượng trước khi sang bước thanh toán.</p></div><div class="cart-layout"><section class="cart-list" id="cartList"></section><aside class="summary" id="summary"></aside></div></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="store.js"></script><script>
async function render(){const s=await KFStore.hydrateCart();if(!s.rows.length){cartList.innerHTML='<div class="empty" style="margin:10px 0">Giỏ hàng đang trống.<br><a class="btn btn-soft" style="display:inline-block;margin-top:10px" href="index.html#san-pham">Xem sản phẩm</a></div>';summary.innerHTML='<h2>Tóm tắt</h2><p style="font-size:12px;color:#81777c">Chưa có sản phẩm.</p>';return}cartList.innerHTML=s.rows.map(r=>{const p=r.product,img=p.image_url||(p.gallery||[])[0]||'sp1.jpg';return `<div class="cart-row"><a href="product.html?id=${encodeURIComponent(p.id)}" target="_blank"><img src="${KFStore.esc(img)}"></a><div><h3><a href="product.html?id=${encodeURIComponent(p.id)}" target="_blank">${KFStore.esc(p.title)}</a></h3><div class="cart-meta">${KFStore.esc(p.tone||'')} · ${KFStore.esc(p.size||'')}</div><div class="qty-mini"><button onclick="change('${p.id}',${r.qty-1})">−</button><span>${r.qty}</span><button onclick="change('${p.id}',${r.qty+1})">+</button></div></div><div style="text-align:right"><b style="font-size:13px">${r.price===null?'Liên hệ giá':KFStore.money(r.price*r.qty)}</b><div><button class="btn btn-light" style="padding:6px 8px;font-size:10px;margin-top:8px" onclick="removeItem('${p.id}')">Xóa</button></div></div></div>`}).join('');summary.innerHTML=`<h2>Tóm tắt đơn</h2><div class="sum-line"><span>Số lượng</span><b>${s.rows.reduce((a,b)=>a+b.qty,0)} sản phẩm</b></div><div class="sum-line"><span>Tạm tính</span><b>${KFStore.money(s.total)}</b></div>${s.hasQuote?'<div class="notice" style="margin:10px 0">Có sản phẩm chưa niêm yết giá. Shop sẽ chốt giá trước khi khách chuyển khoản.</div>':''}<div class="sum-line sum-total"><span>Tổng đã có giá</span><span>${KFStore.money(s.total)}</span></div><a class="btn btn-primary" style="display:block;margin-top:12px" href="checkout.html">Tiến hành đặt hàng</a><a class="btn btn-light" style="display:block;margin-top:8px" href="index.html#san-pham">Tiếp tục mua</a>`}
function change(id,q){KFStore.setQty(id,q);render()}function removeItem(id){if(confirm('Xóa sản phẩm này khỏi giỏ?')){KFStore.removeFromCart(id);render()}}window.addEventListener('kf-cart-change',()=>{});render();</script><div class="contact-float" aria-label="Liên hệ nhanh"><a class="contact-call" href="tel:0356831306" title="Gọi Kim Flora">☎<span>Gọi 0356 831 306</span></a><a class="contact-zalo" href="https://zalo.me/0356831306" target="_blank" rel="noopener" title="Nhắn Zalo">Zalo<span>Nhắn Zalo</span></a><a class="contact-messenger" href="https://m.me/kimshop1306" target="_blank" rel="noopener" title="Nhắn Messenger">f<span>Nhắn Messenger</span></a></div></body></html>
