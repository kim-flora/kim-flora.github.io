<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết sản phẩm | KIM FLORA</title><meta name="description" content="Chi tiết sản phẩm Kim Flora"><link rel="stylesheet" href="app.css"><style>
.product-detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:24px;align-items:start}.gallery-panel,.info-panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.gallery-panel{padding:13px}.main-photo{height:min(720px,72vh);min-height:560px;background:#f6f6f5;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;position:relative}.main-photo img{width:100%;height:100%;object-fit:contain}.zoom-note{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10.5px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:9px}.thumb{width:78px;height:78px;flex:0 0 78px;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#f7f7f7;cursor:pointer}.thumb.active{border-color:#c78da2}.thumb img{width:100%;height:100%;object-fit:cover}.info-panel{padding:23px;position:sticky;top:105px}.detail-tag{display:inline-flex;background:var(--pink-2);border:1px solid #efdce4;color:#905c70;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900;text-transform:uppercase}.info-panel h1{font-size:27px;line-height:1.28;margin:11px 0 8px}.sku{font-size:11px;color:#8c8387}.price-big{font-size:23px;font-weight:900;color:var(--pink-deep);margin:12px 0}.desc{font-size:13.5px;color:#655c61}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.fact{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fcfcfb}.fact b{display:block;font-size:9.5px;color:#8a7780;text-transform:uppercase;letter-spacing:.4px}.fact span{font-size:12px}.qty-row{display:flex;align-items:center;justify-content:space-between;margin:15px 0}.qty{display:flex;border:1px solid #ddd4d8;border-radius:10px;overflow:hidden}.qty button{width:38px;height:38px;border:0;background:#fafafa;cursor:pointer}.qty input{width:45px;text-align:center;border:0;outline:none}.buy-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.trust-row div{background:#fafafa;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;font-size:10.5px;color:#6c6368}.detail-section{margin-top:18px;padding:20px}.detail-section h2{font-size:18px;margin:0 0 9px}.detail-section ul{padding-left:18px;font-size:13px;color:#655d61}.related{margin-top:38px}.lightbox{display:none;position:fixed;inset:0;background:rgba(26,22,24,.94);z-index:999;align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:93vh;object-fit:contain}.lightbox button{position:absolute;right:18px;top:14px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;font-size:24px;cursor:pointer}@media(max-width:900px){.product-detail{grid-template-columns:1fr}.info-panel{position:static}.main-photo{min-height:430px;height:60vh}}@media(max-width:560px){.main-photo{min-height:340px;height:52vh}.info-panel h1{font-size:22px}.facts,.buy-actions,.trust-row{grid-template-columns:1fr}.info-panel{padding:18px}}
</style></head><body>
<div class="topbar"><div class="topbar-inner"><span><strong>KIM FLORA</strong> – Chi tiết sản phẩm</span><span>Phường Tây Thạnh, TP.HCM · 0356 831 306</span></div></div><header class="site-header"><div class="header-inner"><a class="logo" href="index.html"><b>KIM FLORA</b><span>HOA & QUÀ TẶNG</span></a><div class="header-actions"><a class="pill-link" href="account.html"><span data-account-label>Đăng nhập</span></a><a class="pill-link" href="cart.html">Giỏ hàng <span class="cart-count" data-cart-count>0</span></a></div></div></header>
<main class="container"><div style="font-size:11px;color:#8a8085;margin-bottom:14px"><a href="index.html">Trang chủ</a> / Sản phẩm / <span id="crumb">Chi tiết</span></div><div id="root"><div class="empty">Đang tải sản phẩm…</div></div><section class="related"><div class="section-title"><span class="kicker">GỢI Ý THÊM</span><h2>Mẫu khác tại Kim Flora</h2></div><div class="product-grid" id="related"></div></section></main>
<div class="lightbox" id="lightbox"><button onclick="closeLightbox()">×</button><img id="lightboxImg" alt="Ảnh sản phẩm phóng lớn"></div>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="store.js"></script><script>
const id=new URLSearchParams(location.search).get('id');let p=null,qty=1,currentImage='';
function images(){const g=Array.isArray(p?.gallery)?p.gallery.filter(Boolean):[];if(p?.image_url&&!g.includes(p.image_url))g.unshift(p.image_url);return g.length?g:['sp1.jpg']}
function render(){if(!p){root.innerHTML='<div class="empty">Không tìm thấy sản phẩm.</div>';return}document.title=p.title+' | KIM FLORA';crumb.textContent=p.title;const imgs=images();currentImage=imgs[0];root.innerHTML=`<section class="product-detail"><div class="gallery-panel"><div class="main-photo" onclick="openLightbox()"><img id="mainImg" src="${KFStore.esc(currentImage)}" alt="${KFStore.esc(p.title)}"><span class="zoom-note">Bấm ảnh để xem lớn</span></div><div class="thumbs">${imgs.map((x,i)=>`<button class="thumb ${i?'':'active'}" onclick="setImage('${String(x).replace(/'/g,"\\'")}',this)"><img src="${KFStore.esc(x)}" alt="Ảnh ${i+1}"></button>`).join('')}</div></div><aside class="info-panel"><span class="detail-tag">${KFStore.esc(p.tag||p.category||'Kim Flora')}</span><h1>${KFStore.esc(p.title)}</h1><div class="sku">Mã sản phẩm: ${KFStore.esc(String(p.id).slice(0,12))}</div><div class="price-big">${p.price===null||p.price===''?'Liên hệ báo giá':KFStore.money(Number(p.price))}</div><p class="desc">${KFStore.esc(p.description||'')}</p><div class="facts"><div class="fact"><b>Chất liệu</b><span>${KFStore.esc(p.material||'Theo mẫu')}</span></div><div class="fact"><b>Tone màu</b><span>${KFStore.esc(p.tone||'Theo yêu cầu')}</span></div><div class="fact"><b>Kích thước</b><span>${KFStore.esc(p.size||'Theo yêu cầu')}</span></div><div class="fact"><b>Dịp phù hợp</b><span>${KFStore.esc(p.occasion||'Nhiều dịp')}</span></div></div><div class="qty-row"><b>Số lượng</b><div class="qty"><button onclick="changeQty(-1)">−</button><input id="qtyInput" value="1" onchange="setQty(this.value)"><button onclick="changeQty(1)">+</button></div></div><div class="buy-actions"><button class="btn btn-soft" onclick="addCart()">Thêm vào giỏ hàng</button><button class="btn btn-primary" onclick="buyNow()">Mua ngay</button></div><div class="trust-row"><div>Ảnh mẫu rõ ràng</div><div>Tư vấn trước khi làm</div><div>Thanh toán minh bạch</div></div><div class="notice" style="margin-top:12px">Sản phẩm thiết kế theo mùa có thể thay loại hoa, nhưng shop sẽ ưu tiên giữ tone màu, tỷ lệ và tinh thần mẫu.</div></aside></section><section class="panel detail-section"><h2>Thông tin chi tiết</h2><ul>${(Array.isArray(p.notes)?p.notes:[]).map(x=>`<li>${KFStore.esc(x)}</li>`).join('')||'<li>Shop xác nhận mẫu, giá và thời gian giao trước khi thực hiện.</li>'}</ul></section>`}
function setImage(src,btn){currentImage=src;document.getElementById('mainImg').src=src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}function setQty(v){qty=Math.max(1,parseInt(v)||1);qtyInput.value=qty}function changeQty(d){setQty(qty+d)}function addCart(){KFStore.addToCart(id,qty);alert('Đã thêm vào giỏ hàng.')}function buyNow(){KFStore.addToCart(id,qty);location.href='cart.html'}function openLightbox(){lightboxImg.src=currentImage;lightbox.classList.add('open')}function closeLightbox(){lightbox.classList.remove('open')}lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});
async function init(){p=await KFStore.getProduct(id);render();const all=await KFStore.loadProducts();const list=all.filter(x=>String(x.id)!==String(id)).slice(0,4);related.innerHTML=list.map(x=>`<article class="product-card"><a class="product-media" href="product.html?id=${encodeURIComponent(x.id)}" target="_blank"><img src="${KFStore.esc(x.image_url||(x.gallery||[])[0]||'sp1.jpg')}" alt="${KFStore.esc(x.title)}"></a><div class="product-body"><div class="product-name">${KFStore.esc(x.title)}</div><div class="product-price">${x.price===null||x.price===''?'Liên hệ báo giá':KFStore.money(Number(x.price))}</div><a class="btn btn-soft" style="margin-top:10px" href="product.html?id=${encodeURIComponent(x.id)}" target="_blank">Xem chi tiết</a></div></article>`).join('')}
init();</script><div class="contact-float" aria-label="Liên hệ nhanh"><a class="contact-call" href="tel:0356831306" title="Gọi Kim Flora">☎<span>Gọi 0356 831 306</span></a><a class="contact-zalo" href="https://zalo.me/0356831306" target="_blank" rel="noopener" title="Nhắn Zalo">Zalo<span>Nhắn Zalo</span></a><a class="contact-messenger" href="https://m.me/kimshop1306" target="_blank" rel="noopener" title="Nhắn Messenger">f<span>Nhắn Messenger</span></a></div></body></html>
