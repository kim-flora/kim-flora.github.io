<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán | KIM FLORA</title><link rel="stylesheet" href="app.css"><style>.checkout-layout{display:grid;grid-template-columns:1fr 390px;gap:18px;align-items:start}.checkout-side{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;position:sticky;top:105px}.pay-card{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px;background:#fcfcfb}.pay-card img{max-width:230px;margin:10px auto;border:1px solid var(--line);border-radius:10px}.order-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:7px 0;border-bottom:1px solid #f0ecee}.order-row:last-child{border-bottom:0}@media(max-width:900px){.checkout-layout{grid-template-columns:1fr}.checkout-side{position:static}}</style></head><body><header class="site-header"><div class="header-inner"><a class="logo" href="index.html"><b>KIM FLORA</b><span>HOA & QUÀ TẶNG</span></a><div class="header-actions"><a class="pill-link" href="account.html"><span data-account-label>Đăng nhập</span></a><a class="pill-link" href="cart.html">Giỏ hàng <span class="cart-count" data-cart-count>0</span></a></div></div></header><main class="container"><div class="section-title"><span class="kicker">THANH TOÁN</span><h2>Thông tin nhận hàng & thanh toán</h2><p>Khách có thể đăng nhập để theo dõi đơn, nhưng vẫn có thể đặt hàng với thông tin liên hệ đầy đủ.</p></div><div class="checkout-layout"><form class="form-card" id="checkoutForm"><h1>Thông tin đơn hàng</h1><p class="sub">Điền người đặt, người nhận và thời gian giao.</p><div class="form-grid"><div class="field"><label>Họ tên người đặt *</label><input id="customerName" required></div><div class="field"><label>Số điện thoại *</label><input id="phone" inputmode="tel" required></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Tên người nhận</label><input id="recipientName"></div><div class="field"><label>SĐT người nhận</label><input id="recipientPhone" inputmode="tel"></div><div class="field"><label>Ngày giao dự kiến</label><input id="deliveryDate" type="date"></div><div class="field"><label>Khung giờ</label><select id="deliveryTime"><option>Sáng</option><option>Trưa</option><option>Chiều</option><option>Tối</option><option>Shop liên hệ chốt giờ</option></select></div><div class="field full"><label>Địa chỉ giao *</label><textarea id="address" rows="3" required></textarea></div><div class="field full"><label>Lời nhắn / nội dung thiệp</label><textarea id="note" rows="3"></textarea></div></div><div class="pay-card"><b>Phương thức thanh toán</b><label class="checkbox" style="margin-top:10px"><input type="radio" name="pay" value="bank_transfer" checked> Chuyển khoản trước theo thông tin bên cạnh</label><label class="checkbox" style="margin-top:7px"><input type="radio" name="pay" value="confirm_quote"> Chờ shop chốt giá trước (dùng khi có sản phẩm “Liên hệ báo giá”)</label></div><label class="checkbox" style="margin-top:12px"><input id="agree" type="checkbox" required> Tôi đã kiểm tra thông tin giao hàng và đồng ý để Kim Flora liên hệ xác nhận đơn.</label><button class="btn btn-primary" style="width:100%;margin-top:14px" type="submit">Xác nhận đặt hàng</button><div id="formMsg" style="margin-top:12px"></div></form><aside class="checkout-side"><h3 style="margin:0 0 10px">Đơn của bạn</h3><div id="orderPreview"></div><div id="paymentBox"></div></aside></div></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="store.js"></script><script>
let cart=null,payment=null,session=null;function orderCode(){return 'KF'+new Date().toISOString().slice(2,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
async function init(){cart=await KFStore.hydrateCart();session=await KFStore.getSession();payment=await KFStore.getSetting('payment');if(session?.user?.email)email.value=session.user.email;renderSide()}
function renderSide(){if(!cart?.rows.length){orderPreview.innerHTML='<div class="empty">Giỏ hàng trống.</div>';return}orderPreview.innerHTML=cart.rows.map(r=>`<div class="order-row"><span>${r.qty} × ${KFStore.esc(r.product.title)}</span><b>${r.price===null?'Chờ báo giá':KFStore.money(r.price*r.qty)}</b></div>`).join('')+`<div class="order-row" style="font-size:14px"><b>Tổng đã có giá</b><b>${KFStore.money(cart.total)}</b></div>`;if(payment?.account_number){paymentBox.innerHTML=`<div class="pay-card"><b>Chuyển khoản trước</b>${payment.qr_url?`<img src="${KFStore.esc(payment.qr_url)}" alt="QR thanh toán">`:''}<div style="font-size:12px"><div><b>Ngân hàng:</b> ${KFStore.esc(payment.bank_name||'')}</div><div><b>Chủ tài khoản:</b> ${KFStore.esc(payment.account_name||'')}</div><div><b>Số tài khoản:</b> ${KFStore.esc(payment.account_number||'')}</div><div style="margin-top:6px"><b>Nội dung:</b> Tên + SĐT</div></div><div class="notice" style="margin-top:9px">${KFStore.esc(payment.note||'Với đơn chưa có giá, vui lòng chờ shop chốt tổng tiền trước khi chuyển khoản.')}</div></div>`}else{paymentBox.innerHTML='<div class="notice" style="margin-top:12px"><b>Thông tin chuyển khoản chưa được cấu hình.</b><br>Shop sẽ gửi tài khoản/QR sau khi xác nhận giá và thời gian giao.</div>'}}
checkoutForm.addEventListener('submit',async e=>{e.preventDefault();formMsg.innerHTML='';if(!cart?.rows.length){formMsg.innerHTML='<div class="error">Giỏ hàng đang trống.</div>';return}const pay=document.querySelector('input[name="pay"]:checked').value;if(pay==='bank_transfer'&&cart.hasQuote){if(!confirm('Đơn có sản phẩm chưa niêm yết giá. Nên chờ shop chốt giá trước khi chuyển khoản. Vẫn tiếp tục tạo yêu cầu?'))return}const payload={order_code:orderCode(),user_id:session?.user?.id||null,customer_name:customerName.value.trim(),phone:phone.value.trim(),email:email.value.trim()||null,recipient_name:recipientName.value.trim()||null,recipient_phone:recipientPhone.value.trim()||null,address:address.value.trim(),delivery_date:deliveryDate.value||null,delivery_time:deliveryTime.value,note:note.value.trim()||null,items:cart.rows.map(r=>({product_id:r.product.id,title:r.product.title,qty:r.qty,price:r.price,image_url:r.product.image_url||null})),amount:cart.total,has_quote:cart.hasQuote,payment_method:pay,payment_status:'pending',status:'new'};try{if(!KFStore.isConfigured())throw new Error('Website chưa kết nối cơ sở dữ liệu. Hãy cấu hình Supabase một lần để nhận đơn trực tuyến.');const order=await KFStore.createOrder(payload);KFStore.clearCart();formMsg.innerHTML=`<div class="success"><b>Đã tạo đơn ${KFStore.esc(order.order_code)}.</b><br>Kim Flora sẽ liên hệ xác nhận. Nếu đã chuyển khoản, vui lòng gửi ảnh giao dịch qua Zalo.</div><a class="btn btn-primary" style="display:block;margin-top:8px" target="_blank" href="https://zalo.me/0356831306">Gửi xác nhận qua Zalo</a>`;checkoutForm.querySelector('button[type="submit"]').disabled=true}catch(err){formMsg.innerHTML=`<div class="error">${KFStore.esc(err.message||String(err))}</div>`}});init();</script></body></html>
