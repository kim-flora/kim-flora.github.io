<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản | KIM FLORA</title><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="app.css"><style>.login-options{display:grid;gap:10px;margin-top:18px}.oauth{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #ddd6d9;background:#fff;border-radius:11px;padding:11px;font-weight:900;cursor:pointer}.oauth:hover{background:#fafafa}.account-card{max-width:840px;margin:auto}.orders{margin-top:18px}.order-card{border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:9px;background:#fff}.order-head{display:flex;justify-content:space-between;gap:12px;font-size:12px}.order-items{font-size:11.5px;color:#70676b;margin-top:8px}</style></head><body><header class="site-header"><div class="header-inner"><a class="logo" href="index.html"><b>KIM FLORA</b><span>HOA & QUÀ TẶNG</span></a><div class="header-actions"><a class="pill-link" href="cart.html">Giỏ hàng <span class="cart-count" data-cart-count>0</span></a></div></div></header><main class="container"><div id="root" class="account-card panel content-panel"><div class="empty">Đang kiểm tra tài khoản…</div></div></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="store.js"></script><script>

render();</script><div class="contact-float" aria-label="Liên hệ nhanh"><a class="contact-call" href="tel:0356831306" title="Gọi Kim Flora">☎<span>Gọi 0356 831 306</span></a><a class="contact-zalo" href="https://zalo.me/0356831306" target="_blank" rel="noopener" title="Nhắn Zalo">Zalo<span>Nhắn Zalo</span></a><a class="contact-messenger" href="https://m.me/kimshop1306" target="_blank" rel="noopener" title="Nhắn Messenger">f<span>Nhắn Messenger</span></a></div></body></html>
