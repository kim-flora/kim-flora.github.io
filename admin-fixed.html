let colorLibrary=[];let editingColorIndex=null;const gate=document.getElementById('gate'),app=document.getElementById('app'),view=document.getElementById('view');
function msg(t,kind='notice'){return `<div class="${kind}">${KFStore.esc(t)}</div>`}async function login(provider){try{const c=KFStore.client();if(!c)throw new Error('Chưa cấu hình Supabase');const redirectTo='https://kim-flora.github.io/admin.html';const {error}=await c.auth.signInWithOAuth({provider,options:{redirectTo}});if(error)throw error}catch(e){alert(e.message)}}async function logout(){await KFStore.signOut();location.reload()}function tab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===name));renderView(name)}document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>tab(x.dataset.view)));
async function boot(){if(!KFStore.isConfigured()){gate.innerHTML=`<div class="setup-box panel content-panel"><h2>Chưa kết nối cơ sở dữ liệu</h2><p>Trang quản trị đã sẵn sàng, nhưng để chị thêm/sửa sản phẩm mà <b>không cần upload GitHub mỗi lần</b>, cần kết nối Supabase một lần.</p><ol style="font-size:13px;color:#665d62"><li>Tạo dự án Supabase.</li><li>Chạy file <b>supabase-schema.sql</b>.</li><li>Điền Project URL và anon key vào <b>supabase-config.js</b>.</li><li>Upload lại file cấu hình một lần cuối lên GitHub.</li></ol><p><a class="btn btn-primary" href="HUONG_DAN_KET_NOI.txt" target="_blank">Mở hướng dẫn kết nối</a></p></div>`;return}const s=await KFStore.getSession();if(!s){gate.innerHTML=`<div class="login-box panel content-panel"><h2>Đăng nhập quản trị</h2><p style="font-size:13px;color:#756e73">Dùng tài khoản đã được thêm vào bảng <b>admins</b>.</p><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="login('google')">Đăng nhập bằng Google (Gmail)</button><button class="btn btn-soft" style="width:100%;margin-top:8px" onclick="login('facebook')">Đăng nhập bằng Facebook</button></div>`;return}if(!await KFStore.isAdmin()){gate.innerHTML=`<div class="login-box panel content-panel"><h2>Tài khoản chưa có quyền quản trị</h2><p>Email: <b>${KFStore.esc(s.user.email||'')}</b></p><p style="font-size:12px">User ID: <code>${KFStore.esc(s.user.id)}</code></p><p class="notice">Thêm User ID này vào bảng <b>admins</b> trong Supabase một lần. Sau đó tải lại trang.</p><button class="btn btn-light" onclick="logout()">Đăng xuất</button></div>`;return}gate.remove();app.classList.remove('hidden');adminEmail.textContent=s.user.email||s.user.id;await refreshAll();renderView('dashboard')}
async function refreshAll(){[products,orders,articles,categories]=await Promise.all([KFStore.adminProducts(),KFStore.adminOrders(),KFStore.adminArticles(),KFStore.adminCategories()]);await loadAdminColors()}
function renderView(name){if(name==='dashboard')return renderDashboard();if(name==='products')return renderProducts();if(name==='categories')return renderCategories();if(name==='orders')return renderOrders();if(name==='articles')return renderArticles();if(name==='payment')return renderPayment();if(name==='colors')return renderColors()}
function renderDashboard(){view.innerHTML=`<div class="stat-grid"><div class="stat"><b>${products.length}</b><span>Sản phẩm</span></div><div class="stat"><b>${products.filter(x=>x.active).length}</b><span>Đang hiển thị</span></div><div class="stat"><b>${categories.length}</b><span>Danh mục</span></div><div class="stat"><b>${orders.length}</b><span>Đơn hàng</span></div><div class="stat"><b>${orders.filter(x=>x.status==='new').length}</b><span>Đơn mới</span></div></div><div class="panel content-panel" style="margin-top:12px"><h3>Điểm quan trọng</h3><p>Từ khi Supabase đã kết nối, chị thêm/sửa/xóa sản phẩm ở đây thì website khách xem sẽ tự đọc dữ liệu mới. <b>Không cần cập nhật index.html trên GitHub cho mỗi sản phẩm.</b></p></div>`}
function pRow(p){return `<tr><td><img src="${KFStore.esc(p.image_url||(p.gallery||[])[0]||'sp1.jpg')}" style="width:54px;height:54px;object-fit:cover;border-radius:7px"></td><td><b>${KFStore.esc(p.title)}</b><br><small>${KFStore.esc(p.category||'')}</small></td><td>${p.price===null||p.price===''?'Liên hệ':KFStore.money(Number(p.price))}</td><td>${p.active?'Hiện':'Ẩn'}</td><td><button class="btn btn-light" style="padding:6px 8px" onclick="editProduct('${p.id}')">Sửa</button> <button class="btn btn-danger" style="padding:6px 8px" onclick="removeProduct('${p.id}')">Xóa</button></td></tr>`}
function renderProducts(){view.innerHTML=`<div class="admin-grid"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Ảnh</th><th>Sản phẩm</th><th>Giá</th><th>Hiển thị</th><th></th></tr></thead><tbody>${products.map(pRow).join('')||'<tr><td colspan="5">Chưa có sản phẩm.</td></tr>'}</tbody></table></div><div class="admin-form"><h3 id="pFormTitle">Thêm sản phẩm</h3><div class="field"><label>Tên sản phẩm *</label><input id="pTitle"></div><div class="two"><div class="field"><label>Danh mục</label><select id="pCategory"><option value="">Chưa phân loại</option>${categories.filter(c=>c.active).map(c=>`<option value="${KFStore.esc(c.name)}">${KFStore.esc(c.name)}</option>`).join('')}</select><small>Muốn thêm danh mục mới? Mở tab <b>Danh mục</b>.</small></div><div class="field"><label>Chất liệu</label><input id="pMaterial" placeholder="Hoa tươi / hoa sáp..."></div></div><div class="two"><div class="field"><label>Dịp</label><input id="pOccasion"></div><div class="field"><label>Tone màu</label><input id="pTone"></div></div><div class="two"><div class="field"><label>Size</label><input id="pSize"></div><div class="field"><label>Giá (đ)</label><input id="pPrice" type="number" min="0" placeholder="Để trống = Liên hệ"></div></div><div class="field"><label>Mô tả</label><textarea id="pDesc" rows="4"></textarea></div><div class="field"><label>Ghi chú chi tiết (mỗi dòng 1 ý)</label><textarea id="pNotes" rows="3"></textarea></div><div class="field"><label>Ảnh sản phẩm (có thể chọn nhiều)</label><input id="pImages" type="file" accept="image/*" multiple onchange="uploadSelected(this)"><small>Ảnh sẽ lưu vào kho online, khách xem được ngay sau khi lưu.</small><div class="gallery-preview" id="galleryPreview"></div></div><label class="checkbox"><input id="pActive" type="checkbox" checked> Hiển thị trên website</label><label class="checkbox" style="margin-top:6px"><input id="pFeatured" type="checkbox"> Sản phẩm nổi bật</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px"><button class="btn btn-light" onclick="resetProductForm()">Làm mới</button><button class="btn btn-primary" onclick="saveProductForm()">Lưu sản phẩm</button></div><div id="pMsg" style="margin-top:9px"></div></div></div>`;resetProductForm()}
function resetProductForm(){editing=null;gallery=[];['pTitle','pCategory','pMaterial','pOccasion','pTone','pSize','pPrice','pDesc','pNotes'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});if(document.getElementById('pActive'))pActive.checked=true;if(document.getElementById('pFeatured'))pFeatured.checked=false;if(document.getElementById('pFormTitle'))pFormTitle.textContent='Thêm sản phẩm';renderGallery()}
function editProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;editing=p;gallery=Array.isArray(p.gallery)?[...p.gallery]:[];if(p.image_url&&!gallery.includes(p.image_url))gallery.unshift(p.image_url);pFormTitle.textContent='Sửa sản phẩm';pTitle.value=p.title||'';pCategory.value=p.category||'';pMaterial.value=p.material||'';pOccasion.value=p.occasion||'';pTone.value=p.tone||'';pSize.value=p.size||'';pPrice.value=p.price??'';pDesc.value=p.description||'';pNotes.value=(Array.isArray(p.notes)?p.notes:[]).join('\n');pActive.checked=!!p.active;pFeatured.checked=!!p.featured;renderGallery();window.scrollTo({top:0,behavior:'smooth'})}
function renderGallery(){if(!document.getElementById('galleryPreview'))return;galleryPreview.innerHTML=gallery.map((url,i)=>`<div><img src="${KFStore.esc(url)}"><button onclick="gallery.splice(${i},1);renderGallery()" type="button">×</button></div>`).join('')}
async function uploadSelected(input){const files=[...input.files];if(!files.length)return;pMsg.innerHTML=msg('Đang tải ảnh lên...');try{for(const f of files){const url=await KFStore.uploadImage(f,'product-images','products');gallery.push(url)}renderGallery();pMsg.innerHTML=msg('Đã tải ảnh. Bấm “Lưu sản phẩm” để cập nhật.','success')}catch(e){pMsg.innerHTML=msg(e.message,'error')}input.value=''}
async function saveProductForm(){const title=pTitle.value.trim();if(!title){pMsg.innerHTML=msg('Nhập tên sản phẩm trước.','error');return}const obj={title,tag:pCategory.value.trim(),category:pCategory.value.trim(),material:pMaterial.value.trim(),occasion:pOccasion.value.trim(),tone:pTone.value.trim(),size:pSize.value.trim(),price:pPrice.value===''?null:Number(pPrice.value),description:pDesc.value.trim(),notes:pNotes.value.split('\n').map(x=>x.trim()).filter(Boolean),gallery:[...gallery],image_url:gallery[0]||null,active:pActive.checked,featured:pFeatured.checked,sort_order:editing?.sort_order||products.length+1};if(editing)obj.id=editing.id;try{await KFStore.saveProduct(obj);products=await KFStore.adminProducts();renderProducts()}catch(e){pMsg.innerHTML=msg(e.message,'error')}}async function removeProduct(id){if(!confirm('Xóa sản phẩm này?'))return;try{await KFStore.deleteProduct(id);products=await KFStore.adminProducts();renderProducts()}catch(e){alert(e.message)}}
function renderCategories(){
  window._editCategory=null;
  const rows=categories.map(c=>{const count=products.filter(p=>(p.category||'')===c.name).length;return `<tr><td>${c.image_url?`<img src="${KFStore.esc(c.image_url)}" style="width:54px;height:54px;object-fit:cover;border-radius:8px">`:'—'}</td><td><b>${KFStore.esc(c.name)}</b><br><small>${KFStore.esc(c.description||'')}</small></td><td>${count}</td><td>${c.active?'Hiện':'Ẩn'}</td><td>${c.sort_order||0}</td><td><button class="btn btn-light" style="padding:6px 8px" onclick="editCategory('${c.id}')">Sửa</button> <button class="btn btn-danger" style="padding:6px 8px" onclick="removeCategory('${c.id}')">Xóa</button></td></tr>`}).join('');
  view.innerHTML=`<div class="admin-grid"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Ảnh</th><th>Danh mục</th><th>Sản phẩm</th><th>Hiển thị</th><th>Thứ tự</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6">Chưa có danh mục.</td></tr>'}</tbody></table></div><div class="admin-form"><h3 id="cFormTitle">Thêm danh mục</h3><div class="field"><label>Tên danh mục *</label><input id="cName" placeholder="Ví dụ: Hoa handmade, Nơ & phụ kiện"></div><div class="field"><label>Mô tả ngắn</label><textarea id="cDesc" rows="3" placeholder="Mô tả để khách hiểu danh mục này gồm gì"></textarea></div><div class="two"><div class="field"><label>Thứ tự hiển thị</label><input id="cSort" type="number" min="0" value="${categories.length+1}"></div><div class="field"><label>Ảnh đại diện</label><input id="cImageFile" type="file" accept="image/*" onchange="uploadCategoryImage(this)"></div></div><div class="field"><label>URL ảnh</label><input id="cImage" placeholder="Có thể để trống"></div><label class="checkbox"><input id="cActive" type="checkbox" checked> Hiển thị trên website</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px"><button class="btn btn-light" onclick="resetCategoryForm()">Làm mới</button><button class="btn btn-primary" onclick="saveCategoryForm()">Lưu danh mục</button></div><div id="cMsg" style="margin-top:9px"></div><div class="notice" style="margin-top:10px">Khi chị đổi tên danh mục, hệ thống sẽ tự cập nhật các sản phẩm đang thuộc danh mục đó. Không thể xóa một danh mục khi vẫn còn sản phẩm bên trong.</div></div></div>`;
}
function resetCategoryForm(){window._editCategory=null;if(document.getElementById('cFormTitle'))cFormTitle.textContent='Thêm danh mục';if(document.getElementById('cName'))cName.value='';if(document.getElementById('cDesc'))cDesc.value='';if(document.getElementById('cImage'))cImage.value='';if(document.getElementById('cSort'))cSort.value=categories.length+1;if(document.getElementById('cActive'))cActive.checked=true}
function editCategory(id){const c=categories.find(x=>String(x.id)===String(id));if(!c)return;window._editCategory=c;cFormTitle.textContent='Sửa danh mục';cName.value=c.name||'';cDesc.value=c.description||'';cImage.value=c.image_url||'';cSort.value=c.sort_order||0;cActive.checked=!!c.active;window.scrollTo({top:0,behavior:'smooth'})}
async function uploadCategoryImage(input){const f=input.files?.[0];if(!f)return;cMsg.innerHTML=msg('Đang tải ảnh danh mục...');try{cImage.value=await KFStore.uploadImage(f,'site-assets','categories');cMsg.innerHTML=msg('Đã tải ảnh. Bấm Lưu danh mục để cập nhật.','success')}catch(e){cMsg.innerHTML=msg(e.message,'error')}input.value=''}
async function saveCategoryForm(){const name=cName.value.trim();if(!name){cMsg.innerHTML=msg('Nhập tên danh mục trước.','error');return}const obj={name,description:cDesc.value.trim(),image_url:cImage.value.trim()||null,active:cActive.checked,sort_order:Number(cSort.value||0)};if(window._editCategory)obj.id=window._editCategory.id;try{await KFStore.saveCategory(obj,window._editCategory?.name||'');categories=await KFStore.adminCategories();products=await KFStore.adminProducts();renderCategories()}catch(e){cMsg.innerHTML=msg(e.message,'error')}}
async function removeCategory(id){if(!confirm('Xóa danh mục này?'))return;try{await KFStore.deleteCategory(id);categories=await KFStore.adminCategories();renderCategories()}catch(e){alert(e.message)}}
function renderOrders(){view.innerHTML=`<div class="table-wrap"><table class="admin-table"><thead><tr><th>Mã</th><th>Khách</th><th>Giao</th><th>Tiền</th><th>Thanh toán</th><th>Trạng thái</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${KFStore.esc(o.order_code)}</b><br><small>${new Date(o.created_at).toLocaleString('vi-VN')}</small></td><td>${KFStore.esc(o.customer_name)}<br>${KFStore.esc(o.phone)}</td><td>${KFStore.esc(o.address)}<br><small>${KFStore.esc(o.delivery_date||'')} ${KFStore.esc(o.delivery_time||'')}</small></td><td>${KFStore.money(Number(o.amount||0))}${o.has_quote?'<br><small>Có món chờ giá</small>':''}</td><td><select onchange="orderPatch('${o.id}','payment_status',this.value)"><option ${o.payment_status==='pending'?'selected':''} value="pending">Chờ TT</option><option ${o.payment_status==='paid'?'selected':''} value="paid">Đã TT</option><option ${o.payment_status==='refunded'?'selected':''} value="refunded">Hoàn tiền</option></select></td><td><select onchange="orderPatch('${o.id}','status',this.value)"><option ${o.status==='new'?'selected':''} value="new">Mới</option><option ${o.status==='confirmed'?'selected':''} value="confirmed">Đã xác nhận</option><option ${o.status==='making'?'selected':''} value="making">Đang làm</option><option ${o.status==='shipping'?'selected':''} value="shipping">Đang giao</option><option ${o.status==='completed'?'selected':''} value="completed">Hoàn tất</option><option ${o.status==='cancelled'?'selected':''} value="cancelled">Đã hủy</option></select></td><td><a class="btn btn-light" style="padding:6px 8px" target="_blank" href="https://zalo.me/0356831306">Zalo</a></td></tr>`).join('')||'<tr><td colspan="7">Chưa có đơn.</td></tr>'}</tbody></table></div>`}async function orderPatch(id,key,value){try{await KFStore.updateOrder(id,{[key]:value});orders=await KFStore.adminOrders()}catch(e){alert(e.message)}}
function renderArticles(){view.innerHTML=`<div class="admin-grid"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Tiêu đề</th><th>Hiển thị</th><th></th></tr></thead><tbody>${articles.map(a=>`<tr><td><b>${KFStore.esc(a.title)}</b><br><small>${KFStore.esc((a.content||'').slice(0,120))}</small></td><td>${a.active?'Hiện':'Ẩn'}</td><td><button class="btn btn-light" style="padding:6px 8px" onclick="editArticle('${a.id}')">Sửa</button> <button class="btn btn-danger" style="padding:6px 8px" onclick="removeArticle('${a.id}')">Xóa</button></td></tr>`).join('')||'<tr><td colspan="3">Chưa có bài.</td></tr>'}</tbody></table></div><div class="admin-form"><h3 id="aTitleForm">Thêm bài viết</h3><div class="field"><label>Tiêu đề</label><input id="aTitle"></div><div class="field"><label>Nội dung</label><textarea id="aContent" rows="8"></textarea></div><label class="checkbox"><input id="aActive" type="checkbox" checked> Hiển thị</label><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="saveArticleForm()">Lưu bài viết</button></div></div>`;window._editArticle=null}function editArticle(id){const a=articles.find(x=>String(x.id)===String(id));if(!a)return;window._editArticle=a;aTitleForm.textContent='Sửa bài viết';aTitle.value=a.title||'';aContent.value=a.content||'';aActive.checked=!!a.active}async function saveArticleForm(){const obj={title:aTitle.value.trim(),content:aContent.value.trim(),active:aActive.checked,sort_order:window._editArticle?.sort_order||articles.length+1};if(window._editArticle)obj.id=window._editArticle.id;try{await KFStore.saveArticle(obj);articles=await KFStore.adminArticles();renderArticles()}catch(e){alert(e.message)}}async function removeArticle(id){if(confirm('Xóa bài viết?')){await KFStore.deleteArticle(id);articles=await KFStore.adminArticles();renderArticles()}}
function colorFamily(c){const g=String(c?.group||'').trim();return g==='Xanh lá'||g==='Xanh lam'||g==='Xanh'?'Xanh':g||'Trung tính'}
function normalizeColor(c,i){return {...c,group:c.group||'Trung tính',name:String(c.name||`Màu ${i+1}`).trim(),hex:/^#[0-9A-Fa-f]{6}$/.test(String(c.hex||''))?String(c.hex).toUpperCase():'#FFFFFF',temp:c.temp||'',light:c.light||'',emotion:c.emotion||'',meaning:c.meaning||'',match:c.match||'',usage:c.usage||''}}
function sortColorLibrary(list){const rows=(Array.isArray(list)?list:[]).map(normalizeColor);rows.sort((a,b)=>{const ga=COLOR_FAMILY_ORDER.indexOf(colorFamily(a)),gb=COLOR_FAMILY_ORDER.indexOf(colorFamily(b));if(ga!==gb)return ga-gb;return a.name.localeCompare(b.name,'vi',{sensitivity:'base'})});const counters={};return rows.map(x=>{const g=colorFamily(x);counters[g]=(counters[g]||0)+1;return {...x,stt:counters[g],family:g}})}
async function loadAdminColors(){try{const saved=await KFStore.getSetting('colors');colorLibrary=sortColorLibrary(Array.isArray(saved)&&saved.length?saved:COLOR_SEED)}catch(e){colorLibrary=sortColorLibrary(COLOR_SEED)}}
function colorInputValue(v){return KFStore.esc(v==null?'':String(v))}
function renderColors(){
  const q=(document.getElementById('colorAdminSearch')?.value||'').toLowerCase().trim();
  const filter=document.getElementById('colorAdminGroup')?.value||'all';
  const rows=colorLibrary.filter(x=>(filter==='all'||x.family===filter)&&(!q||[x.name,x.group,x.hex,x.temp,x.light,x.emotion,x.meaning,x.match,x.usage].join(' ').toLowerCase().includes(q)));
  view.innerHTML=`<div class="admin-grid"><div class="table-wrap"><div class="color-admin-toolbar" style="padding:12px"><input id="colorAdminSearch" placeholder="Tìm màu, tên, HEX, cảm xúc..." value="${colorInputValue(q)}"><select id="colorAdminGroup"><option value="all">Tất cả nhóm màu</option>${COLOR_FAMILY_ORDER.map(g=>`<option value="${g}" ${filter===g?'selected':''}>${g}</option>`).join('')}</select><button class="btn btn-light" onclick="newColor()">+ Thêm màu</button><button class="btn btn-primary" onclick="saveAllColors()">Lưu bảng màu</button></div><table class="admin-table color-admin-table"><thead><tr><th>STT</th><th>Màu</th><th>Nhóm màu</th><th>Tên sắc độ</th><th>HEX</th><th>Nhiệt độ</th><th>Độ sáng</th><th>Cảm xúc</th><th>Phối hợp</th><th>Hoàn cảnh</th><th></th></tr></thead><tbody>${rows.map(x=>{const i=colorLibrary.indexOf(x);return `<tr><td><b>${x.stt}</b></td><td><span class="swatch" style="display:inline-block;width:32px;height:32px;border-radius:8px;background:${x.hex};border:1px solid rgba(0,0,0,.08)"></span></td><td>${KFStore.esc(x.family)}</td><td><b>${KFStore.esc(x.name)}</b></td><td><code>${KFStore.esc(x.hex)}</code></td><td>${KFStore.esc(x.temp)}</td><td>${KFStore.esc(x.light)}</td><td>${KFStore.esc(x.emotion)}</td><td>${KFStore.esc(x.match)}</td><td>${KFStore.esc(x.usage)}</td><td><button class="btn btn-light" style="padding:6px 8px" onclick="editColor(${i})">Sửa</button> <button class="btn btn-danger" style="padding:6px 8px" onclick="deleteColor(${i})">Xóa</button></td></tr>`}).join('')||'<tr><td colspan="11">Chưa có màu.</td></tr>'}</tbody></table></div><div class="admin-form color-form"><h3 id="colorFormTitle">Thêm màu</h3><div class="field"><label>Nhóm màu *</label><select id="colorGroup">${COLOR_FAMILY_ORDER.map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div><div class="field"><label>Tên sắc độ *</label><input id="colorName"></div><div class="field"><label>Mã HEX *</label><div class="hex-row"><input id="colorHexPicker" type="color" value="#FFFFFF" oninput="colorHex.value=this.value.toUpperCase()"><input id="colorHex" value="#FFFFFF" maxlength="7" placeholder="#FFBDB0" oninput="syncHexPicker(this.value)"></div></div><div class="two"><div class="field"><label>Nhiệt độ</label><input id="colorTemp"></div><div class="field"><label>Độ sáng</label><input id="colorLight"></div></div><div class="field"><label>Cảm xúc</label><input id="colorEmotion"></div><div class="field"><label>Ý nghĩa</label><textarea id="colorMeaning" rows="3"></textarea></div><div class="field"><label>Phối hợp</label><textarea id="colorMatch" rows="3"></textarea></div><div class="field"><label>Hoàn cảnh sử dụng</label><textarea id="colorUsage" rows="3"></textarea></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px"><button class="btn btn-light" onclick="newColor()">Làm mới</button><button class="btn btn-primary" onclick="saveColorForm()">Lưu màu</button></div><div id="colorMsg" style="margin-top:9px"></div><div class="notice" style="margin-top:10px">Hệ thống tự sắp xếp A→Z trong từng họ màu và tự đánh lại STT từ 1 trong mỗi họ. “Xanh lá” và “Xanh lam” hiện cùng thuộc họ <b>Xanh</b>.</div></div></div>`;
  document.getElementById('colorAdminSearch').addEventListener('input',renderColors);
  document.getElementById('colorAdminGroup').addEventListener('change',renderColors);
  if(editingColorIndex!==null) fillColorForm(editingColorIndex);
}
function newColor(){editingColorIndex=null;renderColors();colorFormTitle.textContent='Thêm màu';colorGroup.value='Hồng';colorName.value='';colorHex.value='#FFFFFF';colorHexPicker.value='#FFFFFF';colorTemp.value='';colorLight.value='';colorEmotion.value='';colorMeaning.value='';colorMatch.value='';colorUsage.value='';}
function editColor(i){editingColorIndex=i;renderColors()}
function fillColorForm(i){const x=colorLibrary[i];if(!x)return;colorFormTitle.textContent='Sửa màu';colorGroup.value=colorFamily(x);colorName.value=x.name||'';colorHex.value=x.hex||'#FFFFFF';colorHexPicker.value=x.hex||'#FFFFFF';colorTemp.value=x.temp||'';colorLight.value=x.light||'';colorEmotion.value=x.emotion||'';colorMeaning.value=x.meaning||'';colorMatch.value=x.match||'';colorUsage.value=x.usage||'';}
function syncHexPicker(v){if(/^#[0-9a-fA-F]{6}$/.test(v))colorHexPicker.value=v.toUpperCase()}
function collectColorForm(){const hex=String(colorHex.value||'').trim().toUpperCase();if(!/^#[0-9A-F]{6}$/.test(hex))throw new Error('Mã HEX phải có dạng #RRGGBB.');const name=String(colorName.value||'').trim();if(!name)throw new Error('Nhập tên sắc độ trước.');return {group:colorGroup.value,name,hex,temp:colorTemp.value.trim(),light:colorLight.value.trim(),emotion:colorEmotion.value.trim(),meaning:colorMeaning.value.trim(),match:colorMatch.value.trim(),usage:colorUsage.value.trim()}}
async function saveColorForm(){try{const obj=collectColorForm();if(editingColorIndex===null)colorLibrary.push(obj);else colorLibrary[editingColorIndex]={...colorLibrary[editingColorIndex],...obj};colorLibrary=sortColorLibrary(colorLibrary);await KFStore.saveSetting('colors',colorLibrary);editingColorIndex=null;renderColors();colorMsg.innerHTML=msg('Đã lưu màu và tự sắp xếp lại STT theo nhóm.','success')}catch(e){if(document.getElementById('colorMsg'))colorMsg.innerHTML=msg(e.message,'error');else alert(e.message)}}
async function saveAllColors(){try{colorLibrary=sortColorLibrary(colorLibrary);await KFStore.saveSetting('colors',colorLibrary);renderColors();colorMsg.innerHTML=msg('Đã lưu toàn bộ bảng màu.','success')}catch(e){alert(e.message)}}
async function deleteColor(i){const x=colorLibrary[i];if(!x||!confirm(`Xóa màu “${x.name}” khỏi bảng màu?`))return;try{colorLibrary.splice(i,1);colorLibrary=sortColorLibrary(colorLibrary);await KFStore.saveSetting('colors',colorLibrary);editingColorIndex=null;renderColors()}catch(e){alert(e.message)}}

async function renderPayment(){const p=await KFStore.getSetting('payment')||{bank_name:'VPBank',account_name:'GIAP THI KIM OANH',account_number:'99470868',qr_url:'payment-qr.jpg',note:'Vui lòng kiểm tra đúng tổng tiền trước khi chuyển khoản. Với sản phẩm Liên hệ báo giá, chờ Kim Flora xác nhận giá trước khi chuyển.'};view.innerHTML=`<div class="admin-form" style="max-width:620px;position:static"><h3>Cấu hình thanh toán trước</h3><div class="two"><div class="field"><label>Ngân hàng</label><input id="bankName" value="${KFStore.esc(p.bank_name||'')}"></div><div class="field"><label>Chủ tài khoản</label><input id="bankOwner" value="${KFStore.esc(p.account_name||'')}"></div></div><div class="field"><label>Số tài khoản</label><input id="bankNumber" value="${KFStore.esc(p.account_number||'')}"></div><div class="field"><label>Ảnh QR</label><input type="file" accept="image/*" onchange="uploadQR(this)"><input id="qrUrl" value="${KFStore.esc(p.qr_url||'')}" placeholder="URL ảnh QR" style="margin-top:6px"></div><div class="field"><label>Ghi chú thanh toán</label><textarea id="payNote" rows="4">${KFStore.esc(p.note||'')}</textarea></div><button class="btn btn-primary" onclick="savePayment()">Lưu thông tin thanh toán</button><div id="payMsg" style="margin-top:9px"></div></div>`}async function uploadQR(input){const f=input.files?.[0];if(!f)return;payMsg.innerHTML=msg('Đang tải QR...');try{qrUrl.value=await KFStore.uploadImage(f,'site-assets','payment');payMsg.innerHTML=msg('Đã tải QR. Bấm Lưu để cập nhật.','success')}catch(e){payMsg.innerHTML=msg(e.message,'error')}}async function savePayment(){try{await KFStore.saveSetting('payment',{bank_name:bankName.value.trim(),account_name:bankOwner.value.trim(),account_number:bankNumber.value.trim(),qr_url:qrUrl.value.trim(),note:payNote.value.trim()});payMsg.innerHTML=msg('Đã cập nhật thanh toán. Khách sẽ thấy ở trang checkout.','success')}catch(e){payMsg.innerHTML=msg(e.message,'error')}}
boot();</script></body></html>
